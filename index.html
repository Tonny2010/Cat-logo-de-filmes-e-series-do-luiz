<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA INICIAL -->
    <div id="start-screen">
        <h1>PING PONG</h1>
        <button id="single-btn">Single Player</button>
        <button id="two-btn">Two Players</button>
        <button id="fullscreen-btn">Tela Cheia</button>
    </div>

    <!-- JOGO -->
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <!-- PLACAR -->
        <div id="scoreboard">
            <span id="score-left">0</span>
            <span id="score-right">0</span>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById("start-screen");
        const singleBtn = document.getElementById("single-btn");
        const twoBtn = document.getElementById("two-btn");
        const fullscreenBtn = document.getElementById("fullscreen-btn");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreLeft = document.getElementById("score-left");
        const scoreRight = document.getElementById("score-right");

        let singlePlayer = true;
        let gameRunning = false;

        // Objetos base
        const paddleHeight = 80;
        const paddleWidth = 10;

        const leftPaddle = { x: 10, y: canvas.height / 2 - 40, speed: 6 };
        const rightPaddle = { x: canvas.width - 20, y: canvas.height / 2 - 40, speed: 6 };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 10,
            speedX: 5,
            speedY: 5,
        };

        function startGame(mode) {
            singlePlayer = mode === "single";
            startScreen.style.display = "none";
            document.getElementById("game-container").style.display = "block";
            gameRunning = true;
            resetBall();
            gameLoop();
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speedX *= -1;
            ball.speedY = (Math.random() * 4 + 2) * (Math.random() < 0.5 ? -1 : 1);
        }

        function drawPaddle(p) {
            ctx.fillStyle = "white";
            ctx.fillRect(p.x, p.y, paddleWidth, paddleHeight);
        }

        function drawBall() {
            ctx.fillStyle = "white";
            ctx.fillRect(ball.x, ball.y, ball.size, ball.size);
        }

        function updateBall() {
            ball.x += ball.speedX;
            ball.y += ball.speedY;

            if (ball.y <= 0 || ball.y + ball.size >= canvas.height) {
                ball.speedY *= -1;
            }

            if (
                ball.x <= leftPaddle.x + paddleWidth &&
                ball.y + ball.size >= leftPaddle.y &&
                ball.y <= leftPaddle.y + paddleHeight
            ) {
                ball.speedX *= -1;
            }

            if (
                ball.x + ball.size >= rightPaddle.x &&
                ball.y + ball.size >= rightPaddle.y &&
                ball.y <= rightPaddle.y + paddleHeight
            ) {
                ball.speedX *= -1;
            }

            if (ball.x <= 0) {
                scoreRight.textContent = Number(scoreRight.textContent) + 1;
                resetBall();
            }

            if (ball.x + ball.size >= canvas.width) {
                scoreLeft.textContent = Number(scoreLeft.textContent) + 1;
                resetBall();
            }
        }

        function updatePaddles() {
            if (keys["w"]) leftPaddle.y -= leftPaddle.speed;
            if (keys["s"]) leftPaddle.y += leftPaddle.speed;

            if (!singlePlayer) {
                if (keys["ArrowUp"]) rightPaddle.y -= rightPaddle.speed;
                if (keys["ArrowDown"]) rightPaddle.y += rightPaddle.speed;
            } else {
                if (ball.y < rightPaddle.y + paddleHeight / 2) rightPaddle.y -= rightPaddle.speed;
                if (ball.y > rightPaddle.y + paddleHeight / 2) rightPaddle.y += rightPaddle.speed;
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawPaddle(leftPaddle);
            drawPaddle(rightPaddle);
            drawBall();

            updatePaddles();
            updateBall();

            requestAnimationFrame(gameLoop);
        }

        const keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        singleBtn.onclick = () => startGame("single");
        twoBtn.onclick = () => startGame("two");

        fullscreenBtn.onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            }
        };
    </script>

</body>
</html>
